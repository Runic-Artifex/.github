name: Registry retention report

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify policy
        run: node eng/verify-ci-policy.mjs
      - name: Plan retention
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node eng/registry-maintenance.mjs --output registry-retention-plan.json
      - uses: actions/upload-artifact@v4
        with:
          name: registry-retention-plan
          path: registry-retention-plan.json
          if-no-files-found: error
          retention-days: 14
