name: Bug report
description: Report a reproducible defect
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Security vulnerabilities must be reported privately according to SECURITY.md.
  - type: input
    id: package
    attributes:
      label: Package and version
      placeholder: RunicFlow 0.1.0-preview.4.1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: .NET SDK, Node.js, operating system, architecture
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the smallest code and steps that reproduce the behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      render: text
